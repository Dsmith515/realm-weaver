# Same origin for the app and the API, so the browser needs no CORS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The API host is resolved at request time, so nginx starts even before the API container is up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass $api;
    }

    # Hashed build assets never change; cache them for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/realms/…, /gm/weave) fall back to the app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
