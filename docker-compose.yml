# Local infrastructure and the full app in containers.
#   docker compose up -d                       -> Postgres only (run the API and web app from your IDE / npm)
#   docker compose --profile full up -d --build -> Postgres, API and web app; open http://localhost:8080
# Published ports listen on this machine only. To reach them from other devices on your network, opt in with
#   REALMWEAVER_BIND=0.0.0.0 docker compose ...
# There is no login and the database password is public, so only do that on a network you trust.
name: realm-weaver

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: realmweaver
      POSTGRES_USER: realmweaver
      POSTGRES_PASSWORD: realmweaver # local dev only; never reuse outside your machine
    ports:
      - "${REALMWEAVER_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realmweaver -d realmweaver"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: [full]
    image: ${REALMWEAVER_API_IMAGE:-realm-weaver-api:local}
    build:
      context: .
      dockerfile: src/backend/RealmWeaver.Api/Dockerfile
    environment:
      # Production settings, so no /scalar or /openapi. Migrates and seeds on startup like local runs.
      # No Kerberos here, so skip GSS encryption (the slim image has no libgssapi, which Npgsql would try to load).
      ConnectionStrings__RealmWeaver: Host=postgres;Port=5432;Database=realmweaver;Username=realmweaver;Password=realmweaver;GSS Encryption Mode=Disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: [full]
    image: ${REALMWEAVER_WEB_IMAGE:-realm-weaver-web:local}
    build:
      context: src/frontend
    ports:
      - "${REALMWEAVER_BIND:-127.0.0.1}:8080:8080"
    depends_on:
      - api
    healthcheck:
      # Goes through nginx to the API, so it's healthy only once the whole stack answers.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
