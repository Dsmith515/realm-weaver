# Local development infrastructure.
#   docker compose up -d          -> Postgres only (run the API and web app from your IDE / npm)
# The "full" profile (API + web containers) arrives in Milestone 7.
name: realm-weaver

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: realmweaver
      POSTGRES_USER: realmweaver
      POSTGRES_PASSWORD: realmweaver # local dev only; never reuse outside your machine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realmweaver -d realmweaver"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
