version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    groups:
      dotnet: { patterns: ["*"] }
    ignore:
      # These ship with the .NET runtime; major versions must match the target framework (net10.0).
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: ["version-update:semver-major"]
      - dependency-name: "EFCore.NamingConventions"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /src/frontend
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: [/src/backend/RealmWeaver.Api, /src/frontend]
    schedule: { interval: weekly }
    groups:
      docker: { patterns: ["*"] }
    ignore:
      # The .NET images must stay on the target framework's major version (net10.0).
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
      # Node matches the version CI builds with (ci.yml); bump both together.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    ignore:
      # A Postgres major upgrade needs a dump and restore, so it's done by hand.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
